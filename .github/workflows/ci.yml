name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run lint
        run: ruff check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify release artifact contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found: {wheels}")
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          expected_suffixes = {
              "CITATION.cff",
              "THIRD_PARTY_NOTICES.md",
              "configs/paper-aligned.json",
              "docs/PAPER_ALIGNMENT.md",
              "infer.py",
              "model/__init__.py",
              "third_party_licenses/Apache-2.0.txt",
              "train.py",
          }
          missing = sorted(
              suffix for suffix in expected_suffixes
              if not any(name.endswith(suffix) for name in names)
          )
          if missing:
              raise SystemExit(f"wheel is missing release files: {missing}")
          PY
      - name: Smoke-test the installed wheel
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip uninstall -y dlwa-csi
          python -m pip install --no-deps "$wheel"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python -c "import dlwa_csi, infer, model, train"
          dlwa-train --help >/dev/null
          dlwa-infer --help >/dev/null
          dlwa-spatial-response --interpolation-points 4096 >/dev/null
          dlwa-reliable-recovery --help >/dev/null
